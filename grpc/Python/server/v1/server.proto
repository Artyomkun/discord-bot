syntax = "proto3";

package server.v1;

import "google/protobuf/empty.proto";
import "google/protobuf/timestamp.proto";

// Основной сервис для управления аудио
service AudioService {
  // Управление воспроизведением
  rpc Play(PlayRequest) returns (PlayResponse);
  rpc Stop(StopRequest) returns (StopResponse);
  rpc Pause(PauseRequest) returns (PauseResponse);
  rpc Resume(ResumeRequest) returns (ResumeResponse);
  rpc Skip(SkipRequest) returns (SkipResponse);
  rpc Volume(VolumeRequest) returns (VolumeResponse);
  
  // Очередь
  rpc GetQueue(QueueRequest) returns (QueueResponse);
  rpc ClearQueue(ClearQueueRequest) returns (ClearQueueResponse);
  rpc RemoveFromQueue(RemoveFromQueueRequest) returns (RemoveFromQueueResponse);
  rpc MoveInQueue(MoveInQueueRequest) returns (MoveInQueueResponse);
  rpc ShuffleQueue(ShuffleQueueRequest) returns (ShuffleQueueResponse);
  
  // Эффекты
  rpc ApplyEffects(EffectsRequest) returns (EffectsResponse);
  rpc GetEffects(GetEffectsRequest) returns (GetEffectsResponse);
  rpc ResetEffects(ResetEffectsRequest) returns (ResetEffectsResponse);
  
  // Статус
  rpc GetStatus(StatusRequest) returns (StatusResponse);
  rpc GetMetrics(google.protobuf.Empty) returns (MetricsResponse);
  rpc HealthCheck(google.protobuf.Empty) returns (HealthResponse);
}

// ============ Запросы/Ответы для воспроизведения ============

message PlayRequest {
  string guild_id = 1;
  string user_id = 2;
  string channel_id = 3;
  string url = 4;
  string title = 5;
  map<string, string> options = 6;
}

message PlayResponse {
  bool success = 1;
  string message = 2;
  TrackInfo track = 3;
}

message StopRequest {
  string guild_id = 1;
  string user_id = 2;
}

message StopResponse {
  bool success = 1;
  string message = 2;
}

message PauseRequest {
  string guild_id = 1;
  string user_id = 2;
}

message PauseResponse {
  bool success = 1;
  string message = 2;
}

message ResumeRequest {
  string guild_id = 1;
  string user_id = 2;
}

message ResumeResponse {
  bool success = 1;
  string message = 2;
}

message SkipRequest {
  string guild_id = 1;
  string user_id = 2;
}

message SkipResponse {
  bool success = 1;
  string message = 2;
  TrackInfo next_track = 3;
}

message VolumeRequest {
  string guild_id = 1;
  string user_id = 2;
  int32 volume = 3;  // 0-200
}

message VolumeResponse {
  bool success = 1;
  string message = 2;
  int32 volume = 3;
}

// ============ Очередь ============

message QueueRequest {
  string guild_id = 1;
  string user_id = 2;
}

message QueueResponse {
  bool success = 1;
  repeated TrackInfo tracks = 2;
  TrackInfo current_track = 3;
  int32 total_duration = 4;
  string message = 5;
}

message ClearQueueRequest {
  string guild_id = 1;
  string user_id = 2;
}

message ClearQueueResponse {
  bool success = 1;
  string message = 2;
}

message RemoveFromQueueRequest {
  string guild_id = 1;
  string user_id = 2;
  int32 position = 3;  // 0-based
}

message RemoveFromQueueResponse {
  bool success = 1;
  string message = 2;
  TrackInfo removed_track = 3;
}

message MoveInQueueRequest {
  string guild_id = 1;
  string user_id = 2;
  int32 from_position = 3;
  int32 to_position = 4;
}

message MoveInQueueResponse {
  bool success = 1;
  string message = 2;
  TrackInfo moved_track = 3;
}

message ShuffleQueueRequest {
  string guild_id = 1;
  string user_id = 2;
}

message ShuffleQueueResponse {
  bool success = 1;
  string message = 2;
}

// ============ Эффекты ============

message EffectsRequest {
  string guild_id = 1;
  string user_id = 2;
  repeated Effect effects = 3;
}

message Effect {
  string type = 1;  // reverb, equalizer, compressor, normalize
  map<string, string> params = 2;
}

message EffectsResponse {
  bool success = 1;
  string message = 2;
  repeated string applied_effects = 3;
}

message GetEffectsRequest {
  string guild_id = 1;
  string user_id = 2;
}

message GetEffectsResponse {
  bool success = 1;
  repeated Effect effects = 2;
}

message ResetEffectsRequest {
  string guild_id = 1;
  string user_id = 2;
}

message ResetEffectsResponse {
  bool success = 1;
  string message = 2;
}

// ============ Статус и метрики ============

message StatusRequest {
  string guild_id = 1;
  string user_id = 2;
}

message StatusResponse {
  bool success = 1;
  bool playing = 2;
  bool paused = 3;
  TrackInfo current_track = 4;
  int32 volume = 5;
  int32 queue_length = 6;
  int64 position_ms = 7;
  google.protobuf.Timestamp started_at = 8;
}

message MetricsResponse {
  int64 total_requests = 1;
  int64 successful_requests = 2;
  int64 failed_requests = 3;
  double success_rate = 4;
  double avg_response_time_ms = 5;
  map<string, MethodMetrics> methods = 6;
  WorkerPoolMetrics worker_pool = 7;
  ConnectionPoolMetrics connection_pool = 8;
}

message MethodMetrics {
  int64 total = 1;
  int64 success = 2;
  int64 failed = 3;
  double avg_duration_ms = 4;
  double min_duration_ms = 5;
  double max_duration_ms = 6;
}

message WorkerPoolMetrics {
  int32 total_workers = 1;
  int32 min_workers = 2;
  int32 max_workers = 3;
  double load = 4;
  repeated WorkerMetrics workers = 5;
}

message WorkerMetrics {
  int32 id = 1;
  int32 port = 2;
  string status = 3;
  int64 tasks_processed = 4;
  int64 errors = 5;
  double error_rate = 6;
  double avg_task_duration_ms = 7;
  double uptime_seconds = 8;
  double idle_seconds = 9;
}

message ConnectionPoolMetrics {
  int32 total_connections = 1;
  int32 max_connections = 2;
  double load = 3;
  repeated ConnectionMetrics connections = 4;
}

message ConnectionMetrics {
  string key = 1;
  string created_at = 2;
  string last_used = 3;
  double idle_seconds = 4;
  bool active = 5;
  int64 total_requests = 6;
  int64 failed_requests = 7;
  double success_rate = 8;
  double avg_response_time_ms = 9;
}

message HealthResponse {
  string status = 1;  // "healthy", "degraded", "unhealthy"
  string message = 2;
  google.protobuf.Timestamp timestamp = 3;
  map<string, string> details = 4;
}

// ============ Общие типы ============

message TrackInfo {
  string title = 1;
  string url = 2;
  string artist = 3;
  int32 duration = 4;  // seconds
  string requester = 5;
  bool is_stream = 6;
  string thumbnail = 7;
}