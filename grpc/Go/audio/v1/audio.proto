syntax = "proto3";

package audio.v1;

option go_package = "./audio_processor";
option java_package = "com.bot.grpc.audio";
option java_outer_classname = "AudioServiceProto";
option java_multiple_files = false;
option elixir_package = "Bot.Audio.V1";

// Audio Service — управление аудио и 8D эффектами
service AudioService {
    // ========== УПРАВЛЕНИЕ ВОСПРОИЗВЕДЕНИЕМ ==========
    rpc Play(PlayRequest) returns (PlayResponse);
    rpc Stop(StopRequest) returns (StopResponse);
    rpc Pause(PauseRequest) returns (PauseResponse);
    rpc Resume(ResumeRequest) returns (ResumeResponse);
    rpc Skip(SkipRequest) returns (SkipResponse);
    rpc Seek(SeekRequest) returns (SeekResponse);
    
    // ========== УПРАВЛЕНИЕ ОЧЕРЕДЬЮ ==========
    rpc GetQueue(QueueRequest) returns (QueueResponse);
    rpc AddToQueue(AddToQueueRequest) returns (AddToQueueResponse);
    rpc RemoveFromQueue(RemoveFromQueueRequest) returns (RemoveFromQueueResponse);
    rpc MoveInQueue(MoveInQueueRequest) returns (MoveInQueueResponse);
    rpc ClearQueue(ClearQueueRequest) returns (ClearQueueResponse);
    rpc ShuffleQueue(ShuffleQueueRequest) returns (ShuffleQueueResponse);
    
    // ========== 8D ЭФФЕКТЫ ==========
    rpc Apply8DEffect(Apply8DEffectRequest) returns (Apply8DEffectResponse);
    rpc GetActiveEffects(GetEffectsRequest) returns (GetEffectsResponse);
    rpc ResetEffects(ResetEffectsRequest) returns (ResetEffectsResponse);
    
    // ========== АУДИО ОБРАБОТКА ==========
    rpc Normalize(NormalizeRequest) returns (NormalizeResponse);
    rpc Equalize(EqualizeRequest) returns (EqualizeResponse);
    rpc Compress(CompressRequest) returns (CompressResponse);
    rpc ApplyReverb(ReverbRequest) returns (ReverbResponse);
    
    // ========== АНАЛИЗ ==========
    rpc Analyze(AnalyzeRequest) returns (AnalyzeResponse);
    
    // ========== СТАТУС ==========
    rpc GetStatus(StatusRequest) returns (StatusResponse);
    rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// ========== ОБЩИЕ СООБЩЕНИЯ ==========

message TrackInfo {
    string id = 1;
    string title = 2;
    string artist = 3;
    string duration = 4;
    int32 duration_ms = 5;
    string url = 6;
    string thumbnail = 7;
    string requester_id = 8;
    string requester_name = 9;
    int64 requested_at = 10;
}

// ========== УПРАВЛЕНИЕ ВОСПРОИЗВЕДЕНИЕМ ==========

message PlayRequest {
    string guild_id = 1;
    string user_id = 2;
    string query = 3;
    string voice_channel_id = 4;
    map<string, string> options = 5;
}

message PlayResponse {
    bool success = 1;
    string message = 2;
    TrackInfo track = 3;
    int32 position = 4;
    int32 queue_length = 5;
}

message StopRequest {
    string guild_id = 1;
    string user_id = 2;
}

message StopResponse {
    bool success = 1;
    string message = 2;
}

message PauseRequest {
    string guild_id = 1;
    string user_id = 2;
}

message PauseResponse {
    bool success = 1;
    string message = 2;
}

message ResumeRequest {
    string guild_id = 1;
    string user_id = 2;
}

message ResumeResponse {
    bool success = 1;
    string message = 2;
}

message SkipRequest {
    string guild_id = 1;
    string user_id = 2;
    int32 count = 3;
}

message SkipResponse {
    bool success = 1;
    string message = 2;
    TrackInfo previous_track = 3;
    TrackInfo current_track = 4;
    bool has_next = 5;
}

message SeekRequest {
    string guild_id = 1;
    string user_id = 2;
    int32 position_ms = 3;
}

message SeekResponse {
    bool success = 1;
    string message = 2;
    int32 new_position_ms = 3;
}

// ========== ОЧЕРЕДЬ ==========

message QueueRequest {
    string guild_id = 1;
    string user_id = 2;
    int32 limit = 3;
    int32 offset = 4;
}

message QueueResponse {
    bool success = 1;
    string message = 2;
    TrackInfo current_track = 3;
    int32 current_position_ms = 4;
    repeated TrackInfo tracks = 5;
    int32 total = 6;
    int32 duration_ms = 7;
    bool loop = 8;
    bool shuffle = 9;
}

message AddToQueueRequest {
    string guild_id = 1;
    string user_id = 2;
    string query = 3;
    int32 position = 4;
}

message AddToQueueResponse {
    bool success = 1;
    string message = 2;
    TrackInfo track = 3;
    int32 position = 4;
    int32 queue_length = 5;
}

message RemoveFromQueueRequest {
    string guild_id = 1;
    string user_id = 2;
    int32 position = 3;
}

message RemoveFromQueueResponse {
    bool success = 1;
    string message = 2;
    TrackInfo removed_track = 3;
    int32 queue_length = 4;
}

message MoveInQueueRequest {
    string guild_id = 1;
    string user_id = 2;
    int32 from_position = 3;
    int32 to_position = 4;
}

message MoveInQueueResponse {
    bool success = 1;
    string message = 2;
    TrackInfo moved_track = 3;
}

message ClearQueueRequest {
    string guild_id = 1;
    string user_id = 2;
}

message ClearQueueResponse {
    bool success = 1;
    string message = 2;
    int32 cleared_count = 3;
}

message ShuffleQueueRequest {
    string guild_id = 1;
    string user_id = 2;
}

message ShuffleQueueResponse {
    bool success = 1;
    string message = 2;
    int32 shuffled_count = 3;
}

// ========== 8D ЭФФЕКТЫ ==========

message Apply8DEffectRequest {
    string guild_id = 1;
    string user_id = 2;
    double rotation_speed = 3;      // скорость вращения (0.1-2.0 Гц)
    double rotation_angle = 4;      // угол вращения (0-360°)
    double lfo_frequency = 5;       // частота LFO модуляции
    double filter_q = 6;            // резонанс
    double intensity = 7;           // интенсивность эффекта (0.0-1.0)
    map<string, string> params = 8;
}

message Apply8DEffectResponse {
    bool success = 1;
    string message = 2;
    string effect_id = 3;
}

message GetEffectsRequest {
    string guild_id = 1;
    string user_id = 2;
}

message GetEffectsResponse {
    bool success = 1;
    repeated EffectInfo effects = 2;
}

message ResetEffectsRequest {
    string guild_id = 1;
    string user_id = 2;
}

message ResetEffectsResponse {
    bool success = 1;
    string message = 2;
    int32 reset_count = 3;
}

message EffectInfo {
    string id = 1;
    string type = 2;
    double intensity = 3;
    bool active = 4;
    int64 applied_at = 5;
    map<string, string> params = 6;
}

// ========== АУДИО ОБРАБОТКА ==========

message NormalizeRequest {
    string guild_id = 1;
    string user_id = 2;
    double target_lufs = 3;          // целевой уровень LUFS (по умолчанию -16)
    double max_true_peak = 4;        // максимальный пик (по умолчанию -1.5)
    string mode = 5;                 // ebu_r128, rms, peak, hybrid, auto
}

message NormalizeResponse {
    bool success = 1;
    string message = 2;
    double original_lufs = 3;
    double original_peak = 4;
    double new_lufs = 5;
    double new_peak = 6;
}

message EqualizeRequest {
    string guild_id = 1;
    string user_id = 2;
    string preset = 3;               // flat, bass_boost, vocal_boost, treble_enhance, radio, loudness, mastering
    repeated EqualizerBand bands = 4;
}

message EqualizerBand {
    double frequency = 1;
    double gain = 2;
    double q = 3;
    string type = 4;                 // peaking, low_shelf, high_shelf, notch
}

message EqualizeResponse {
    bool success = 1;
    string message = 2;
}

message CompressRequest {
    string guild_id = 1;
    string user_id = 2;
    double threshold = 3;            // порог срабатывания (-60..0 dB)
    double ratio = 4;                // коэффициент сжатия (1..20)
    int32 attack = 5;                // время атаки (0..200 ms)
    int32 release = 6;               // время восстановления (0..500 ms)
    double knee = 7;                 // мягкость перехода (0..30 dB)
    double makeup_gain = 8;          // компенсация громкости
    string type = 9;                 // compressor, limiter, expander, gate
}

message CompressResponse {
    bool success = 1;
    string message = 2;
    double gain_reduction = 3;
    double output_peak = 4;
}

message ReverbRequest {
    string guild_id = 1;
    string user_id = 2;
    string preset = 3;               // room, hall, church, plate, spring
    double room_size = 4;            // 0.0-1.0
    double damping = 5;              // 0.0-1.0
    double wet_level = 6;            // 0.0-1.0
    double dry_level = 7;            // 0.0-1.0
    double width = 8;                // 0.0-1.0
    int32 pre_delay = 9;             // ms
    double diffusion = 10;           // 0.0-1.0
    double decay = 11;               // 0.0-1.0
}

message ReverbResponse {
    bool success = 1;
    string message = 2;
}

// ========== АНАЛИЗ ==========

message AnalyzeRequest {
    string guild_id = 1;
    string user_id = 2;
}

message AnalyzeResponse {
    bool success = 1;
    string message = 2;
    double integrated_loudness = 3;   // LUFS
    double loudness_range = 4;        // LRA
    double true_peak = 5;             // dBTP
    double rms_level = 6;             // RMS dB
    double crest_factor = 7;
    double spectral_centroid = 8;     // Гц
    double spectral_spread = 9;       // Гц
    double spectral_rolloff = 10;     // Гц
    int32 channels = 11;
    int32 sample_rate = 12;
    double duration = 13;
    repeated FrequencyBand frequency_bands = 14;
}

message FrequencyBand {
    double frequency = 1;
    double energy = 2;
    double energy_db = 3;
    double deviation = 4;
}

// ========== СТАТУС ==========

message StatusRequest {
    string guild_id = 1;
    string user_id = 2;
}

message StatusResponse {
    bool success = 1;
    bool playing = 2;
    bool paused = 3;
    TrackInfo current_track = 4;
    int32 current_position_ms = 5;
    int32 volume = 6;
    int32 queue_length = 7;
    bool loop = 8;
    bool shuffle = 9;
    string voice_channel_id = 10;
    int64 started_at = 11;
    int64 paused_at = 12;
    repeated EffectInfo active_effects = 13;
}

message HealthRequest {
    string service = 1;
}

message HealthResponse {
    string status = 1;
    string message = 2;
    int64 timestamp = 3;
    HealthDetails details = 4;
}

message HealthDetails {
    bool ffmpeg_alive = 1;
    bool discord_voice_connected = 2;
    int64 current_guilds = 3;
    int64 active_streams = 4;
    double cpu_usage = 5;
    int64 memory_bytes = 6;
}