syntax = "proto3";

package GoClient.v1;

import "google/protobuf/descriptor.proto";

option go_package = "./goclient";
option java_package = "com.bot.grpc";
option java_outer_classname = "AudioServiceProto";
option java_multiple_files = false;

extend google.protobuf.FileOptions {
  string elixir_package = 50002;
}

option (elixir_package) = "Client.V1";

// Клиентский сервис для отправки команд в Java Gateway
service GoClient {
    // Отправка команды
    rpc SendCommand(CommandRequest) returns (CommandResponse);
    
    // Управление воспроизведением
    rpc Play(PlayRequest) returns (PlayResponse);
    rpc Stop(StopRequest) returns (StopResponse);
    rpc Pause(PauseRequest) returns (PauseResponse);
    rpc Resume(ResumeRequest) returns (ResumeResponse);
    rpc Skip(SkipRequest) returns (SkipResponse);
    rpc Seek(SeekRequest) returns (SeekResponse);
    
    // Управление очередью
    rpc GetQueue(QueueRequest) returns (QueueResponse);
    rpc AddToQueue(AddToQueueRequest) returns (AddToQueueResponse);
    rpc RemoveFromQueue(RemoveFromQueueRequest) returns (RemoveFromQueueResponse);
    rpc MoveInQueue(MoveInQueueRequest) returns (MoveInQueueResponse);
    rpc ClearQueue(ClearQueueRequest) returns (ClearQueueResponse);
    rpc ShuffleQueue(ShuffleQueueRequest) returns (ShuffleQueueResponse);
    
    // Управление громкостью и эффектами
    rpc SetVolume(VolumeRequest) returns (VolumeResponse);
    rpc ApplyEffects(EffectsRequest) returns (EffectsResponse);
    rpc GetEffects(GetEffectsRequest) returns (GetEffectsResponse);
    rpc ResetEffects(ResetEffectsRequest) returns (ResetEffectsResponse);
    
    // Статус
    rpc GetStatus(StatusRequest) returns (StatusResponse);
    rpc HealthCheck(HealthRequest) returns (HealthResponse);
}

// ========== ОБЩИЕ СООБЩЕНИЯ ==========

message CommandRequest {
    string command = 1;
    string user_id = 2;
    string guild_id = 3;
    string channel_id = 4;
    map<string, string> options = 5;
}

message CommandResponse {
    bool success = 1;
    string message = 2;
    map<string, string> data = 3;
}

// ========== ТРЕК ==========

message TrackInfo {
    string id = 1;
    string title = 2;
    string artist = 3;
    string duration = 4;
    int32 duration_ms = 5;
    string url = 6;
    string thumbnail = 7;
    string requester_id = 8;
    string requester_name = 9;
    int64 requested_at = 10;
}

// ========== ЗАПРОСЫ И ОТВЕТЫ ==========

// Play
message PlayRequest {
    string guild_id = 1;
    string user_id = 2;
    string query = 3;
    string voice_channel_id = 4;
    map<string, string> options = 5;
}

message PlayResponse {
    bool success = 1;
    string message = 2;
    TrackInfo track = 3;
    int32 position = 4;
    int32 queue_length = 5;
}

// Stop
message StopRequest {
    string guild_id = 1;
    string user_id = 2;
}

message StopResponse {
    bool success = 1;
    string message = 2;
}

// Pause
message PauseRequest {
    string guild_id = 1;
    string user_id = 2;
}

message PauseResponse {
    bool success = 1;
    string message = 2;
}

// Resume
message ResumeRequest {
    string guild_id = 1;
    string user_id = 2;
}

message ResumeResponse {
    bool success = 1;
    string message = 2;
}

// Skip
message SkipRequest {
    string guild_id = 1;
    string user_id = 2;
    int32 count = 3;
}

message SkipResponse {
    bool success = 1;
    string message = 2;
    TrackInfo previous_track = 3;
    TrackInfo current_track = 4;
    bool has_next = 5;
}

// Seek
message SeekRequest {
    string guild_id = 1;
    string user_id = 2;
    int32 position_ms = 3;
}

message SeekResponse {
    bool success = 1;
    string message = 2;
    int32 new_position_ms = 3;
}

// Queue
message QueueRequest {
    string guild_id = 1;
    string user_id = 2;
    int32 limit = 3;
    int32 offset = 4;
}

message QueueResponse {
    bool success = 1;
    string message = 2;
    TrackInfo current_track = 3;
    int32 current_position_ms = 4;
    repeated TrackInfo tracks = 5;
    int32 total = 6;
    int32 duration_ms = 7;
    bool loop = 8;
    bool shuffle = 9;
}

// AddToQueue
message AddToQueueRequest {
    string guild_id = 1;
    string user_id = 2;
    string query = 3;
    int32 position = 4;
}

message AddToQueueResponse {
    bool success = 1;
    string message = 2;
    TrackInfo track = 3;
    int32 position = 4;
    int32 queue_length = 5;
}

// RemoveFromQueue
message RemoveFromQueueRequest {
    string guild_id = 1;
    string user_id = 2;
    int32 position = 3;
}

message RemoveFromQueueResponse {
    bool success = 1;
    string message = 2;
    TrackInfo removed_track = 3;
    int32 queue_length = 4;
}

// MoveInQueue
message MoveInQueueRequest {
    string guild_id = 1;
    string user_id = 2;
    int32 from_position = 3;
    int32 to_position = 4;
}

message MoveInQueueResponse {
    bool success = 1;
    string message = 2;
    TrackInfo moved_track = 3;
}

// ClearQueue
message ClearQueueRequest {
    string guild_id = 1;
    string user_id = 2;
}

message ClearQueueResponse {
    bool success = 1;
    string message = 2;
    int32 cleared_count = 3;
}

// ShuffleQueue
message ShuffleQueueRequest {
    string guild_id = 1;
    string user_id = 2;
}

message ShuffleQueueResponse {
    bool success = 1;
    string message = 2;
    int32 shuffled_count = 3;
}

// Volume
message VolumeRequest {
    string guild_id = 1;
    string user_id = 2;
    int32 volume = 3;
}

message VolumeResponse {
    bool success = 1;
    string message = 2;
    int32 volume = 3;
}

// Effects
message EffectsRequest {
    string guild_id = 1;
    string user_id = 2;
    string effect_type = 3;
    double intensity = 4;
    map<string, string> params = 5;
}

message EffectsResponse {
    bool success = 1;
    string message = 2;
    repeated string applied_effects = 3;
}

// GetEffects
message GetEffectsRequest {
    string guild_id = 1;
    string user_id = 2;
}

message GetEffectsResponse {
    bool success = 1;
    map<string, EffectInfo> effects = 2;
}

message EffectInfo {
    string type = 1;
    double intensity = 2;
    bool active = 3;
    map<string, string> params = 4;
}

// ResetEffects
message ResetEffectsRequest {
    string guild_id = 1;
    string user_id = 2;
}

message ResetEffectsResponse {
    bool success = 1;
    string message = 2;
}

// Status
message StatusRequest {
    string guild_id = 1;
    string user_id = 2;
}

message StatusResponse {
    bool success = 1;
    bool playing = 2;
    bool paused = 3;
    TrackInfo current_track = 4;
    int32 current_position_ms = 5;
    int32 volume = 6;
    int32 queue_length = 7;
    bool loop = 8;
    bool shuffle = 9;
    string voice_channel_id = 10;
    int64 started_at = 11;
    int64 paused_at = 12;
}

// Health
message HealthRequest {
    string service = 1;
}

message HealthResponse {
    string status = 1;
    string message = 2;
    int64 timestamp = 3;
    map<string, HealthCheck> checks = 4;
}

message HealthCheck {
    string status = 1;
    string message = 2;
    int64 latency_ms = 3;
    int64 last_check = 4;
}