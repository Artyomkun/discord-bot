# Rate limiting zone
limit_req_zone $binary_remote_addr zone=onnx:20m rate=10r/s;
limit_req_zone $binary_remote_addr zone=api:20m rate=30r/s;
limit_req_zone $binary_remote_addr zone=search:20m rate=20r/s;

# Логирование
log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                '$status $body_bytes_sent "$http_referer" '
                '"$http_user_agent" rt=$request_time';

server {
    # HTTP/2 + HTTP/3
    listen 443 quic reuseport;
    listen 443 ssl http2;
    listen [::]:443 quic reuseport;
    listen [::]:443 ssl http2;
    
    server_name onnx.miku.com localhost api.miku.com;
    
    # SSL
    ssl_certificate /etc/nginx/ssl/web.pem;
    ssl_certificate_key /etc/nginx/ssl/web.key;
    
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers 'ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    
    # OCSP Stapling
    ssl_stapling on;
    ssl_stapling_verify on;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    
    # HTTP/3
    add_header Alt-Svc 'h3=":443"; ma=86400';
    
    # Security headers
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    
    # ========== API ==========
    location /api/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        limit_req zone=api burst=10 nodelay;
        proxy_buffering off;
    }
    
    # ========== Search ==========
    location /search {
        proxy_pass http://localhost:8080/search;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        limit_req zone=search burst=5 nodelay;
        proxy_connect_timeout 10s;
        proxy_read_timeout 30s;
    }
    
    # ========== WebSocket ==========
    location /ws/ {
        proxy_pass http://localhost:8080;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
    }
    
    # ========== ONNX модель ==========
    location /model.onnx {
        alias /mnt/d/Kodland/elixir_music_bot/go_processor/web/model/model.onnx;
        
        sendfile on;
        tcp_nopush on;
        
        expires max;
        add_header Cache-Control "public, immutable, max-age=31536000";
        add_header Content-Type "application/octet-stream";
        
        limit_req zone=onnx burst=5 nodelay;
        limit_rate 50m;
        
        # Локальный доступ
        allow 127.0.0.1;
        allow 192.168.0.0/16;
        allow 10.0.0.0/8;
        deny all;
        
        access_log off;
    }
    
    # ========== Production status ==========
    location /production/status {
        add_header Content-Type text/plain;
        return 200 "ONNX Production Ready\nHTTP/3 Enabled\n";
    }
    
    # ========== Health check ==========
    location /health {
        access_log off;
        return 200 "OK\n";
    }
    
    # ========== Nginx metrics ==========
    location /metrics {
        stub_status on;
        access_log off;
        allow 127.0.0.1;
        deny all;
    }
    
    # ========== Rate limit error ==========
    error_page 429 /429.html;
    location = /429.html {
        return 429 "Rate limit exceeded\n";
    }
}

# ========== HTTP → HTTPS redirect ==========
server {
    listen 80;
    listen [::]:80;
    server_name onnx.miku.com localhost api.miku.com;
    return 301 https://$server_name$request_uri;
}