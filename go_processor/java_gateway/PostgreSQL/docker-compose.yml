version: '3.8'

services:
  postgres:
    build: .
    container_name: miku-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: music_bot
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./extra-init.sql:/docker-entrypoint-initdb.d/02-extra.sql
      - ./backups:/backups
    networks:
      - music_network
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  postgres-backup:
    image: postgres:15-alpine
    container_name: miku-postgres-backup
    volumes:
      - postgres_data:/data
      - ./backups:/backups
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: music_bot
    command: |
      sh -c '
      while true; do
        pg_dump -h postgres -U postgres music_bot > /backups/backup_$$(date +%Y%m%d_%H%M%S).sql
        sleep 86400
      done
      '
    depends_on:
      - postgres
    networks:
      - music_network

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: miku-postgres-exporter
    environment:
      DATA_SOURCE_NAME: "postgresql://postgres:password@postgres:5432/music_bot?sslmode=disable"
    ports:
      - "9187:9187"
    depends_on:
      - postgres
    networks:
      - music_network

networks:
  music_network:
    external: true
    name: music_network

volumes:
  postgres_data:
    name: miku_postgres_data