services:
  music_core:
    build: ../../../music_core
    ports:
      - "4000:4000"
    volumes:
      - ../../../music_core/_build:/app/_build
      - ../../../music_core/deps:/app/deps
      - ../../../logs/music_core:/app/logs
    environment:
      - DATABASE_URL=postgres://postgres:password@postgres:5432/music_bot?sslmode=disable
    networks:
      - music_bot_net

  go_processor:
    build: ../../
    ports:
      - "8081:8081"
    volumes:
      - go_mod_cache:/go/pkg/mod
      - ../../../logs/go_processor:/app/logs
    depends_on:
      - music_core
    environment:
      - JAVA_GATEWAY_URL=http://java_gateway:8080
      - ELIXIR_CORE_URL=http://music_core:4000
      - DATABASE_URL=postgres://postgres:password@postgres:5432/music_bot?sslmode=disable
    networks:
      - music_bot_net

  java_gateway:
    build: ../
    ports:
      - "8080:8080"
    volumes:
      - maven_cache:/root/.m2
      - ../../../logs/java_gateway:/app/logs
    depends_on:
      - go_processor
    environment:
      - GO_PROCESSOR_URL=http://go_processor:8081
      - ELIXIR_CORE_URL=http://music_core:4000
    networks:
      - music_bot_net

  python_client:
    build: ./
    ports:
      - "5000:5000"
    volumes:
      - pip_cache:/root/.cache/pip
      - ../../../logs/python_client:/app/logs
    environment:
      - JAVA_GATEWAY_URL=http://java_gateway:8080
      - DATABASE_URL=postgres://postgres:password@postgres:5432/music_bot
    networks:
      - music_bot_net
    depends_on:
      - java_gateway

  rust_native:
    build: ../../../music_core/audio_effects/native
    command: make test
    volumes:
      - ../../../logs/rust_native:/app/logs
    networks:
      - music_bot_net

  c_native:
    build: ../../../music_core/audio_effects/native/c_src
    command: make test
    volumes:
      - ../../../logs/c_native:/app/logs
    networks:
      - music_bot_net

  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: music_bot
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
    volumes:
      - ../PostgreSQL:/var/lib/postgresql/data
    networks:
      - music_bot_net

volumes:
  go_mod_cache:
  maven_cache:
  pip_cache:

networks:
  music_bot_net:
    driver: bridge
