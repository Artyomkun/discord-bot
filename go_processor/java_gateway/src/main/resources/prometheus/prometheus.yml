global:
  scrape_interval: 15s

scrape_configs:
  - job_name: 'java-gateway'
    metrics_path: '/actuator/prometheus'
    static_configs:
      - targets: ['java-gateway:8080']

  - job_name: 'kafka-exporter'
    static_configs:
      - targets: ['kafka-exporter:9308']

  - job_name: 'go-processor'
    static_configs:
      - targets: ['go-processor:8081']

  - job_name: 'elixir-core'
    static_configs:
      - targets: ['elixir-core:4000']