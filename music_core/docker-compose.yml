services:
  # ============================================================================
  # БАЗЫ ДАННЫХ И КЭШ
  # ============================================================================
  
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: music_core
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ============================================================================
  # C DSP-БИБЛИОТЕКА (CPU + GPU бэкенды)
  # ============================================================================
  
  c-dsp:
    build: 
      context: ./audio_effects/native/c_src
      args:
        CUDA_SUPPORT: 1
        ROCK_SUPPORT: 1
    environment:
      - CUDA_SUPPORT=1
      - ROCK_SUPPORT=1
      - ZLUDA_SUPPORT=0
    volumes:
      - dsp_libs:/usr/local/lib/dsp
    restart: unless-stopped

  # ============================================================================
  # Rust DSP-ДВИЖОК (NIF)
  # ============================================================================
  
  rust-effects:
    build: 
      context: ./audio_effects/native
      args:
        FEATURES: "parallel,gpu-cuda,gpu-rock"
    depends_on:
      - c-dsp
    environment:
      - RUST_LOG=info
      - DSP_GPU_BACKEND=auto
    volumes:
      - dsp_libs:/usr/local/lib/dsp
      - rust_target:/app/target
    restart: unless-stopped

  # ============================================================================
  # Elixir Music Core
  # ============================================================================
  
  elixir-core:
    build: 
      context: ./music_core
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      c-dsp:
        condition: service_started
      rust-effects:
        condition: service_started
    ports:
      - "4000:4000"   # HTTP API
      - "4001:4001"   # WebSocket
      - "4002:4002"   # gRPC сервер
      - "50052:50052" # gRPC клиент
      - "8080:8080"   # Prometheus metrics
    environment:
      - MIX_ENV=prod
      - PORT=4000
      - GRPC_PORT=50051
      - METRICS_PORT=8080
      - DB_HOST=postgres
      - DB_PORT=5432
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - DSP_LIB_PATH=/usr/local/lib/dsp
      - DSP_GPU_BACKEND=auto
    volumes:
      - dsp_libs:/usr/local/lib/dsp
      - elixir_build:/app/_build
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    restart: unless-stopped

  # ============================================================================
  # Go Processor (ONNX Inference)
  # ============================================================================
  
  go-processor:
    build: 
      context: ./go_processor
      dockerfile: Dockerfile
    ports:
      - "8082:8082"   # gRPC сервер
    environment:
      - ASSUME_NO_MOVING_GC_UNSAFE_RISK_IT_WITH=go1.25
      - DB_HOST=postgres
      - DB_PORT=5432
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # Java Gateway
  # ============================================================================
  
  java-gateway:
    build: 
      context: ./java_gateway
      dockerfile: Dockerfile
    ports:
      - "8081:8081"   # gRPC сервер
      - "8083:8083"   # gRPC клиент
    environment:
      - JAVA_OPTS=-Xmx512m -Xms256m
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ============================================================================
  # Python Processor (ML Models)
  # ============================================================================
  
  python-processor:
    build: 
      context: ./python_processor
      dockerfile: Dockerfile
    ports:
      - "5000:5000"   # HTTP API
      - "50051:50051" # gRPC сервер
      - "50053:50053" # gRPC клиент
    environment:
      - PYTHONUNBUFFERED=1
      - MODEL_PATH=/models
      - REDIS_HOST=redis
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - models:/models
    restart: unless-stopped

  # ============================================================================
  # МОНИТОРИНГ
  # ============================================================================
  
  prometheus:
    image: prom/prometheus:latest
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    depends_on:
      - elixir-core
    restart: unless-stopped

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_INSTALL_PLUGINS=grafana-clock-panel,grafana-simple-json-datasource
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/dashboards:/etc/grafana/provisioning/dashboards
      - ./grafana/datasources:/etc/grafana/provisioning/datasources
    depends_on:
      - prometheus
    restart: unless-stopped

  # ============================================================================
  # Discord Bot (опционально)
  # ============================================================================
  
  discord-bot:
    build: 
      context: ./discord_bot
      dockerfile: Dockerfile
    depends_on:
      elixir-core:
        condition: service_healthy
    environment:
      - DISCORD_TOKEN=${DISCORD_TOKEN}
      - MUSIC_CORE_URL=http://elixir-core:4000
    restart: unless-stopped
    profiles:
      - bot

# ============================================================================
# VOLUMES
# ============================================================================

volumes:
  pg_data:
  redis_data:
  dsp_libs:
  rust_target:
  elixir_build:
  models:
  prometheus_data:
  grafana_data: