[package]
name = "audio_effects_native"
version = "0.1.0"
edition = "2018"
authors = ["elixir_music_bot"]
description = "High-performance audio effects processing for Elixir Music Bot"
license = "MIT"
repository = "https://github.com/Artyomkun/Kodland/elixir_music_bot"

[lib]
name = "audio_effects_native"
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
rustler = { version = "0.37.0", features = ["derive"] }
bincode = { version = "2.0.0", features = ["serde"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
num = "0.4.3"
num-complex = "0.4.6"
num-traits = "0.2.18"
rand = "0.10.1"
rustfft = "6.4.1"
lazy_static = "1.4.0"
log = "0.4"
libm = "0.2"
ndarray = "0.17.2"
rayon = { version = "1.11.0", optional = true }
thiserror = "2.0.17"
parking_lot = "0.12.5"
crossbeam = "0.8.4"
bytemuck = "1.24.0"

# Опциональные зависимости
rustc_version_runtime = "0.3"
ndarray-parallel = "0.9.1"
realfft = "3.5.0"
tracing = "0.1.43"
tracing-subscriber = "0.3.22"
wgpu = "29.0.3"
rustacuda = "0.1.3"

[build-dependencies]
cc = "1.0"

[dev-dependencies]
criterion = "0.8.2"

[profile.dev]
opt-level = 1
debug = true
debug-assertions = true
overflow-checks = true
incremental = true
codegen-units = 256
lto = false

[profile.release]
opt-level = 3
debug = false
debug-assertions = false
overflow-checks = false
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

[features]
default = ["parallel"]
parallel = ["rayon"]
gpu = []
gpu-cuda = []
gpu-rock = []
gpu-zluda = []
benchmarks = []
c-api = []
dynamic-crt = []
buffer_512 = []
buffer_1024 = []
buffer_2048 = []
buffer_4096 = []

[lints.rust]
explicit_builtin_cfgs_in_flags = "allow"